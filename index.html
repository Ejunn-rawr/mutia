<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Galaksi Cinta untuk Mutia 💖</title>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- GSAP + ScrollTrigger -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
/* ═══════════════════════════════════════════
   RESET & ROOT VARIABLES
═══════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --pink: #ff6eb4;
  --magenta: #ff2d9b;
  --cyan: #00f5ff;
  --purple: #bf5fff;
  --deep: #03000f;
  --glass: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.15);
}
html { scroll-behavior: smooth; }
body {
  background: var(--deep);
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: #fff;
  overflow-x: hidden;
  cursor: none;
}

/* ═══════════════════════════════════════════
   CUSTOM CURSOR
═══════════════════════════════════════════ */
#cursor-outer {
  position: fixed; width: 32px; height: 32px;
  border: 2px solid var(--pink); border-radius: 50%;
  pointer-events: none; z-index: 99999;
  transform: translate(-50%, -50%);
  transition: width .2s, height .2s, border-color .2s;
  box-shadow: 0 0 14px var(--pink);
}
#cursor-inner {
  position: fixed; width: 7px; height: 7px;
  background: var(--cyan); border-radius: 50%;
  pointer-events: none; z-index: 99999;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 10px var(--cyan);
}

/* ═══════════════════════════════════════════
   LOADING SCREEN
═══════════════════════════════════════════ */
#loading-screen {
  position: fixed; inset: 0;
  background: #000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10000;
  gap: 20px;
}
.load-heart {
  font-size: clamp(50px, 10vw, 80px);
  animation: heartbeat 1s ease-in-out infinite;
  filter: drop-shadow(0 0 20px var(--pink)) drop-shadow(0 0 40px var(--pink));
}
@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  14%      { transform: scale(1.25); }
  28%      { transform: scale(1); }
  42%      { transform: scale(1.18); }
}
.load-title {
  font-size: clamp(13px, 3vw, 18px);
  letter-spacing: 6px; color: var(--pink);
  text-transform: uppercase;
  text-shadow: 0 0 20px var(--pink);
}
.load-bar-wrap {
  width: clamp(200px, 50vw, 340px);
  height: 3px; background: rgba(255,255,255,0.1);
  border-radius: 10px; overflow: hidden;
}
.load-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--pink), var(--cyan));
  border-radius: 10px;
  box-shadow: 0 0 10px var(--pink);
  transition: width .05s linear;
}
.load-dots { display: flex; gap: 8px; }
.load-dot {
  width: 8px; height: 8px;
  background: var(--pink); border-radius: 50%;
  animation: dot-bounce 1.4s ease-in-out infinite;
  box-shadow: 0 0 8px var(--pink);
}
.load-dot:nth-child(2) { animation-delay: .2s; }
.load-dot:nth-child(3) { animation-delay: .4s; }
@keyframes dot-bounce {
  0%,80%,100% { transform: scale(0.8); opacity: .5; }
  40%          { transform: scale(1.3); opacity: 1; }
}

/* ═══════════════════════════════════════════
   INTRO SCREEN
═══════════════════════════════════════════ */
#intro-screen {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, #0d002a 0%, #000 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 9999;
  opacity: 0; pointer-events: none;
  gap: 18px; padding: 20px; text-align: center;
}
.intro-icon {
  font-size: clamp(60px, 12vw, 100px);
  animation: float-icon 3s ease-in-out infinite;
  filter: drop-shadow(0 0 30px var(--pink)) drop-shadow(0 0 60px var(--magenta));
}
@keyframes float-icon {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-18px); }
}
.intro-title {
  font-size: clamp(22px, 6vw, 52px);
  font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(135deg, #fff, var(--pink), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  line-height: 1.2;
}
.intro-sub {
  font-size: clamp(11px, 2.5vw, 16px);
  letter-spacing: 5px; color: var(--cyan);
  text-shadow: 0 0 15px var(--cyan);
  text-transform: uppercase;
}
.intro-stars {
  font-size: clamp(18px, 4vw, 28px);
  animation: spin-stars 8s linear infinite;
  display: block;
  filter: drop-shadow(0 0 8px gold);
}
@keyframes spin-stars { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.btn-enter {
  margin-top: 12px;
  padding: clamp(12px, 2vw, 18px) clamp(28px, 5vw, 52px);
  background: linear-gradient(135deg, var(--magenta), var(--purple));
  border: none; border-radius: 50px;
  font-size: clamp(13px, 2.5vw, 17px); font-weight: 700;
  color: #fff; cursor: pointer; letter-spacing: 1px;
  box-shadow: 0 0 30px rgba(255,45,155,0.6), 0 0 60px rgba(255,45,155,0.2);
  animation: pulse-btn 2s ease-in-out infinite;
  transition: transform .2s;
}
.btn-enter:hover { transform: scale(1.07); }
@keyframes pulse-btn {
  0%,100% { box-shadow: 0 0 30px rgba(255,45,155,.6), 0 0 60px rgba(255,45,155,.2); }
  50%      { box-shadow: 0 0 50px rgba(0,245,255,.7), 0 0 80px rgba(0,245,255,.3); }
}

/* ═══════════════════════════════════════════
   WARP OVERLAY
═══════════════════════════════════════════ */
#warp-overlay {
  position: fixed; inset: 0;
  z-index: 9998; display: none;
  background: #000;
}
#warp-canvas { width: 100%; height: 100%; }

/* ═══════════════════════════════════════════
   MUTE BUTTON
═══════════════════════════════════════════ */
#mute-btn {
  position: fixed; bottom: 24px; right: 24px;
  z-index: 5000; width: 48px; height: 48px;
  background: var(--glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  border-radius: 50%; font-size: 22px;
  cursor: pointer; display: none;
  align-items: center; justify-content: center;
  box-shadow: 0 0 16px rgba(255,110,180,.3);
  transition: transform .2s;
}
#mute-btn:hover { transform: scale(1.15); }

/* ═══════════════════════════════════════════
   MAIN SITE WRAPPER (hidden until warp done)
═══════════════════════════════════════════ */
#site-wrapper {
  display: none;
  opacity: 0;
}

/* ═══════════════════════════════════════════
   HERO SECTION (3D Canvas)
═══════════════════════════════════════════ */
#hero-section {
  position: relative;
  width: 100%; height: 100vh;
  overflow: hidden;
}
#three-canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
}
/* Scroll indicator */
#scroll-indicator {
  position: absolute;
  bottom: 28px; left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; gap: 8px;
  animation: bob-scroll 2s ease-in-out infinite;
}
.scroll-text {
  font-size: clamp(10px, 2vw, 13px);
  letter-spacing: 3px; color: rgba(255,255,255,.6);
  text-align: center;
}
.scroll-arrow {
  font-size: 22px;
  filter: drop-shadow(0 0 8px var(--pink));
  animation: arrow-pulse 1.5s ease-in-out infinite;
}
@keyframes bob-scroll {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50%      { transform: translateX(-50%) translateY(8px); }
}
@keyframes arrow-pulse {
  0%,100% { opacity: .5; }
  50%      { opacity: 1; }
}

/* ═══════════════════════════════════════════
   POP-UP MODAL
═══════════════════════════════════════════ */
#popup-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(6px);
  z-index: 8000;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
#popup-overlay.visible { opacity: 1; pointer-events: auto; }
.popup-card {
  background: linear-gradient(135deg, rgba(30,0,60,.85), rgba(0,10,40,.85));
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 28px 24px;
  max-width: 420px; width: 100%;
  text-align: center;
  box-shadow: 0 0 60px rgba(255,45,155,.4), 0 0 120px rgba(0,245,255,.1);
  transform: scale(.85);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
}
#popup-overlay.visible .popup-card { transform: scale(1); }
.popup-img {
  width: 100%; max-height: 220px; object-fit: cover;
  border-radius: 16px; margin-bottom: 16px;
  border: 2px solid rgba(255,110,180,.4);
  box-shadow: 0 0 24px rgba(255,110,180,.3);
}
.popup-title {
  font-size: clamp(16px, 3.5vw, 22px); font-weight: 700;
  background: linear-gradient(90deg, var(--pink), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 10px;
}
.popup-text {
  font-size: clamp(13px, 2.5vw, 15px);
  color: rgba(255,255,255,.85); line-height: 1.7;
  margin-bottom: 20px;
}
.popup-close {
  padding: 10px 28px;
  background: linear-gradient(135deg, var(--magenta), var(--purple));
  border: none; border-radius: 50px;
  color: #fff; font-size: 14px; font-weight: 700;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(255,45,155,.5);
  transition: transform .2s;
}
.popup-close:hover { transform: scale(1.06); }

/* ═══════════════════════════════════════════
   STORYLINE SECTION
═══════════════════════════════════════════ */
#story-section {
  position: relative;
  z-index: 2;
  padding: clamp(60px, 10vh, 120px) clamp(16px, 4vw, 40px);
  background: transparent;
}

/* Glowing vertical timeline line */
.timeline-wrap {
  position: relative;
  max-width: 900px;
  margin: 0 auto;
}
.timeline-line {
  position: absolute;
  left: 50%; top: 0; bottom: 0;
  width: 2px;
  transform: translateX(-50%);
  background: linear-gradient(180deg, transparent, var(--pink), var(--cyan), var(--purple), transparent);
  box-shadow: 0 0 18px var(--pink), 0 0 40px rgba(255,45,155,.3);
}
@media (max-width: 680px) {
  .timeline-line { left: 20px; }
}

/* Story card */
.story-card {
  position: relative;
  width: calc(50% - 40px);
  background: linear-gradient(135deg, rgba(30,0,60,.7), rgba(0,10,40,.7));
  backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 24px 20px;
  margin-bottom: 70px;
  opacity: 0;
  box-shadow: 0 0 30px rgba(255,45,155,.1);
  transition: box-shadow .3s;
}
.story-card:hover {
  box-shadow: 0 0 50px rgba(255,45,155,.25), 0 0 80px rgba(0,245,255,.1);
}
.story-card.left  { margin-left: 0;      margin-right: auto; transform: translateX(-40px); }
.story-card.right { margin-left: auto;   margin-right: 0;    transform: translateX(40px); }
@media (max-width: 680px) {
  .story-card { width: calc(100% - 50px); margin-left: 50px !important; margin-right: 0 !important; }
  .story-card.left  { transform: translateX(20px); }
  .story-card.right { transform: translateX(20px); }
}

/* Timeline dot */
.story-card::before {
  content: '💖';
  position: absolute;
  top: 24px;
  font-size: 18px;
  filter: drop-shadow(0 0 8px var(--pink));
}
.story-card.left::before  { right: -52px; }
.story-card.right::before { left: -52px; }
@media (max-width: 680px) {
  .story-card::before { left: -38px !important; right: auto !important; }
}

.story-badge {
  display: inline-block;
  padding: 4px 14px;
  background: linear-gradient(90deg, var(--magenta), var(--purple));
  border-radius: 50px; font-size: 11px;
  font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase;
  box-shadow: 0 0 12px rgba(255,45,155,.5);
  margin-bottom: 12px;
}
.story-img-wrap {
  width: 100%; border-radius: 14px; overflow: hidden;
  margin-bottom: 14px;
  border: 1px solid rgba(255,110,180,.3);
  box-shadow: 0 0 20px rgba(255,110,180,.2);
}
.story-img {
  width: 100%; height: clamp(150px, 30vw, 220px);
  object-fit: cover; display: block;
  transition: transform .5s ease;
}
.story-img-wrap:hover .story-img { transform: scale(1.06); }
.story-title {
  font-size: clamp(15px, 3vw, 20px); font-weight: 700;
  background: linear-gradient(90deg, var(--pink), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 10px;
}
.story-text {
  font-size: clamp(12px, 2.2vw, 14px);
  color: rgba(255,255,255,.8); line-height: 1.75;
  font-style: italic;
}

/* ═══════════════════════════════════════════
   ENDING SECTION
═══════════════════════════════════════════ */
#ending-section {
  position: relative; z-index: 2;
  padding: clamp(60px, 12vh, 140px) 20px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; overflow: hidden;
}
.ending-card {
  position: relative;
  background: linear-gradient(135deg, rgba(40,0,80,.85), rgba(0,15,50,.85));
  border: 1px solid rgba(255,110,180,.3);
  border-radius: 28px;
  padding: clamp(32px, 6vw, 64px) clamp(24px, 5vw, 80px);
  max-width: 620px; width: 100%;
  backdrop-filter: blur(18px);
  box-shadow: 0 0 80px rgba(255,45,155,.35), 0 0 160px rgba(0,245,255,.1);
  overflow: hidden;
}
.ending-title {
  font-size: clamp(22px, 6vw, 48px); font-weight: 900;
  background: linear-gradient(135deg, #fff, var(--pink), var(--cyan));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 20px; line-height: 1.2;
}
.ending-sub {
  font-size: clamp(13px, 2.5vw, 16px);
  color: rgba(255,255,255,.7); line-height: 1.8;
  margin-bottom: 28px;
}
.btn-top {
  padding: clamp(12px, 2vw, 16px) clamp(28px, 5vw, 50px);
  background: linear-gradient(135deg, var(--pink), var(--purple), var(--cyan));
  background-size: 200% 200%;
  border: none; border-radius: 50px;
  color: #fff; font-size: clamp(13px, 2.5vw, 16px);
  font-weight: 700; cursor: pointer; letter-spacing: 1px;
  box-shadow: 0 0 30px rgba(255,45,155,.5);
  animation: btn-grad 4s ease infinite;
  transition: transform .2s;
  text-decoration: none; display: inline-block;
}
.btn-top:hover { transform: scale(1.07); }
@keyframes btn-grad {
  0%,100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}

/* Heart particle rain (ending) */
.heart-particle {
  position: absolute;
  pointer-events: none;
  animation: fall-heart linear infinite;
  font-size: 18px;
  opacity: .8;
}
@keyframes fall-heart {
  0%   { transform: translateY(-60px) rotate(0deg); opacity: .9; }
  100% { transform: translateY(110%) rotate(360deg); opacity: 0; }
}

/* ═══════════════════════════════════════════
   FIXED BG — galaksi tetap di belakang saat scroll
═══════════════════════════════════════════ */
#three-canvas-fixed {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none; /* diaktifkan hanya di hero */
  opacity: 0;
}

/* ═══════════════════════════════════════════
   TRAIL PARTICLE
═══════════════════════════════════════════ */
.trail {
  position: fixed; pointer-events: none; z-index: 99998;
  border-radius: 50%; animation: trail-out .8s ease-out forwards;
}
@keyframes trail-out {
  0%   { opacity: .9; transform: scale(1); }
  100% { opacity: 0;  transform: scale(0) translate(var(--tx), var(--ty)); }
}
</style>
</head>
<body>

<!-- Custom Cursor -->
<div id="cursor-outer"></div>
<div id="cursor-inner"></div>

<!-- Mute Button -->
<button id="mute-btn">🔊</button>

<!-- Loading Screen -->
<div id="loading-screen">
  <div class="load-heart">💖</div>
  <div class="load-title">Loading Memories...</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-dots">
    <div class="load-dot"></div>
    <div class="load-dot"></div>
    <div class="load-dot"></div>
  </div>
</div>

<!-- Intro Screen -->
<div id="intro-screen">
  <span class="intro-stars">⭐ 🌸 💫 🌙 💖 ✨ 🌟</span>
  <div class="intro-icon">🌌</div>
  <h1 class="intro-title">Galaksi Cinta<br>untuk Mutia</h1>
  <p class="intro-sub">Dari Ejunn untuk Mutia</p>
  <button class="btn-enter" id="btn-enter">Lihat lebih lanjut yukk 🚀</button>
</div>

<!-- Warp Transition -->
<div id="warp-overlay">
  <canvas id="warp-canvas"></canvas>
</div>

<!-- Pop-up Modal -->
<div id="popup-overlay">
  <div class="popup-card">
    <img class="popup-img" id="popup-img" src="" alt="foto" />
    <div class="popup-title" id="popup-title"></div>
    <div class="popup-text"  id="popup-text"></div>
    <button class="popup-close" id="popup-close">KEMBALI ❤️</button>
  </div>
</div>

<!-- ═══ MAIN SITE ═══ -->
<div id="site-wrapper">

  <!-- Hero / 3D Section -->
  <section id="hero-section">
    <canvas id="three-canvas"></canvas>
    <div id="scroll-indicator">
      <div class="scroll-text">Scroll ke Bawah untuk Melihat Cerita Kita</div>
      <div class="scroll-arrow">↓</div>
    </div>
  </section>

  <!-- Storyline Section -->
  <section id="story-section">
    <div class="timeline-wrap" id="timeline-wrap">
      <div class="timeline-line"></div>
      <!-- Story cards dibuat oleh JS dari CONFIG.storylineData -->
    </div>
  </section>

  <!-- Ending Section -->
  <section id="ending-section">
    <div class="ending-card" id="ending-card">
      <div class="ending-title">Mutia ❤️ Ejunn Forever</div>
      <div class="ending-sub">
        Terima kasih sudah jadi bagian terbaik dari hari-hariku.<br>
        Kamu segalanya, Mutia 🌌✨
      </div>
      <a href="#" class="btn-top" id="btn-top">Kembali ke Atas Galaksi ↑</a>
    </div>
  </section>

</div><!-- /#site-wrapper -->

<!-- Audio Element -->
<audio id="bg-music" loop preload="auto"></audio>

<!-- ═══════════════════════════════════════════
     MAIN SCRIPT
═══════════════════════════════════════════ -->
<script>
'use strict';

/* ════════════════════════════════════════════════════════
   ██████╗ ██████╗ ███╗   ██╗███████╗██╗ ██████╗
  ██╔════╝██╔═══██╗████╗  ██║██╔════╝██║██╔════╝
  ██║     ██║   ██║██╔██╗ ██║█████╗  ██║██║  ███╗
  ██║     ██║   ██║██║╚██╗██║██╔══╝  ██║██║   ██║
  ╚██████╗╚██████╔╝██║ ╚████║██║     ██║╚██████╔╝
   ╚═════╝ ╚═════╝ ╚═╝  ╚═══╝╚═╝     ╚═╝ ╚═════╝
   BLOK KONFIGURASI UTAMA — UBAH DI SINI SAJA!
════════════════════════════════════════════════════════ */
const CONFIG = {

  /* ── URL file musik latar yang akan diputar saat masuk galaksi ── */

  /* ── Array daftar foto Mutia yang melayang di ruang 3D galaksi ── */

    'foto1.jpeg',
    'foto2.jpeg',
    'foto3.jpeg',
    'foto4.jpeg',
    'foto5.jpeg',
    'foto6.jpeg'
  ],

  /* ── 3 kartu pop-up yang muncul saat elemen 3D diklik ──
     Setiap kartu punya: title, text, dan image (nama file foto) */
  popupCards: [
    {
      title: 'dari Ejunn ✨',
      text:  'satu titik dua koma... mutia cantik ejunn yg punya ><',
      image: 'foto1.jpeg'
    },
    {
      title: 'halo pacarnya Ejunnn 💖',
      text:  'Makin hari makin manis aja. eaa ada yang salting niii.',
      image: 'foto2.jpeg'
    },
    {
      title: 'Semestanya Ejunn 🌙',
      text:  'Tetap sama aku terus ya sayangkuu.',
      image: 'foto3.jpeg'
    }
  ],

  /* ── Data alur cerita (storyline) untuk bagian bawah website ──
     Setiap item punya: chapter, title, story, image */
  storylineData: [
    {
      chapter: 'Momen 1 ✨',
      title:   'My Heart Jedag Jedug',
      story:   'kenapa setiap hujan ada geludug? karena kalo ada kamu my heart jedag jedug',
      image:   'foto1.jpeg'
    },
    {
      chapter: 'Momen 2 💖',
      title:   'Si Imut Kesayangan Ejunn',
      story:   'ada gula ada semut i love you imut',
      image:   'foto2.jpeg'

/* ════════════════════════════════════════════════════════
   WARP SPEED TRANSITION
════════════════════════════════════════════════════════ */
function startWarp(onDone) {
  const overlay = $('warp-overlay');
  const wc = $('warp-canvas');
  overlay.style.display = 'block';
  gsap.fromTo(overlay, { opacity: 0 }, { opacity: 1, duration: .4 });

  wc.width  = window.innerWidth;
  wc.height = window.innerHeight;
  const ctx = wc.getContext('2d');
  const cx = wc.width / 2, cy = wc.height / 2;

  const stars = Array.from({ length: 500 }, () => ({
    x: rnd(-1, 1), y: rnd(-1, 1),
    z: Math.random(), pz: 0,
    hue: rnd(280, 360)
  }));

  let speed = 0.002, frame = 0;
  function drawWarp() {
    if (frame > 90) {
      gsap.to(overlay, { opacity: 0, duration: .5, onComplete: () => {
        overlay.style.display = 'none';
        onDone();
      }});
      return;
    }
    frame++;
    speed = Math.min(speed + 0.003, 0.1);
    ctx.fillStyle = 'rgba(2,0,20,.4)';
    ctx.fillRect(0, 0, wc.width, wc.height);

    stars.forEach(s => {
      s.pz = s.z;
      s.z -= speed;
      if (s.z <= 0) { s.x = rnd(-1,1); s.y = rnd(-1,1); s.z = 1; s.pz = 1; }
      const sx = s.x / s.z * cx + cx, sy = s.y / s.z * cy + cy;
      const px = s.x / s.pz * cx + cx, py = s.y / s.pz * cy + cy;
      const br = clamp(1 - s.z, 0.3, 1);
      ctx.strokeStyle = `hsla(${s.hue},100%,80%,${br})`;
      ctx.lineWidth = clamp(Math.hypot(sx-px, sy-py) * .08, .5, 4);
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx, sy); ctx.stroke();
    });
    requestAnimationFrame(drawWarp);
  }
  drawWarp();
}

/* ─── Nebula background shader ─── */
function buildNebula() {
  const geo = new THREE.PlaneGeometry(3000, 3000);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0.25, 0.02, 0.45) } },
    vertexShader: `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
    `,
    fragmentShader: `
      uniform float uTime; uniform vec3 uColor;
      varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float noise(vec2 p){
        vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
      }
      void main(){
        vec2 uv = vUv-.5;
        float n = noise(uv*3.0+uTime*.03)*0.5 + noise(uv*6.0-uTime*.02)*0.3 + noise(uv*12.0)*0.2;
        vec3 deep = vec3(.01,.00,.06);
        vec3 col = mix(deep, uColor, n*.65);
        float v = 1.-dot(uv*1.5,uv*1.5);
        col *= clamp(v,.0,1.);
        gl_FragColor = vec4(col,1.0);
      }
    `,
    depthWrite: false, side: THREE.DoubleSide
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.z = -1200;
  m.userData.isNebula = true;
  threeScene.add(m);
}

/* ─── Deep star field ─── */
function buildStarField() {
  const N = 3000;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const sz  = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    pos[i*3]   = rnd(-1200, 1200);
    pos[i*3+1] = rnd(-1200, 1200);
    pos[i*3+2] = rnd(-900, -100);
    const c = new THREE.Color().setHSL(rnd(0,1), .8, rnd(.6,1));
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    sz[i] = rnd(.5, 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sz,  1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader:`
      attribute float size; attribute vec3 color; varying vec3 vCol;
      uniform float uTime;
      void main(){
        vCol=color;
        vec3 p=position; p.z+=sin(uTime*.2+p.x*.01)*5.;
        vec4 mv=modelViewMatrix*vec4(p,1.);
        gl_PointSize=size*(280./-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying vec3 vCol;
      void main(){
        float d=length(gl_PointCoord-.5)*2.; if(d>1.)discard;
        gl_FragColor=vec4(vCol,pow(1.-d,2.));
      }`,
    transparent:true, vertexColors:true, depthWrite:false, blending:THREE.AdditiveBlending
  });
  threeScene.add(new THREE.Points(geo, mat));
}

/* ─── Galaxy spiral vortex ─── */
function buildGalaxyVortex() {
  const N = 6000;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const sz  = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const arm   = Math.floor(rnd(0, 3));
    const t     = rnd(0.15, 1);
    const radius= t * 260;
    const angle = t * 4 * Math.PI + arm * (2*Math.PI/3) + rnd(-0.25, 0.25);
    const spread= rnd(0, 18) * (1 - t * .6);
    pos[i*3]   = Math.cos(angle) * radius + rnd(-spread, spread);
    pos[i*3+1] = rnd(-12, 12) * (1 - t*.7);
    pos[i*3+2] = Math.sin(angle) * radius + rnd(-spread, spread);
    // Pink → Cyan gradient along radius
    const ratio = t;
    const c = new THREE.Color().setHSL(0.83 - ratio * 0.33, 1, 0.65 + ratio * .2);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    sz[i] = rnd(.8, 3.5);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sz,  1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader:`
      attribute float size; attribute vec3 color; varying vec3 vCol; varying float vAlpha;
      uniform float uTime;
      void main(){
        vCol=color;
        float pulse=.9+.1*sin(uTime*2.+position.x*.02);
        vAlpha=.5+.5*sin(uTime*.5+position.z*.01);
        vec4 mv=modelViewMatrix*vec4(position,1.);
        gl_PointSize=size*pulse*(300./-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying vec3 vCol; varying float vAlpha;
      void main(){
        float d=length(gl_PointCoord-.5)*2.; if(d>1.)discard;
        float g=1.-smoothstep(.3,1.,d);
        gl_FragColor=vec4(vCol+vec3(g*.4), (pow(1.-d,2.5)+g*.3)*vAlpha);
      }`,
    transparent:true, vertexColors:true, depthWrite:false, blending:THREE.AdditiveBlending
  });
  galaxyMesh = new THREE.Points(geo, mat);
  threeScene.add(galaxyMesh);
}

/* ─── 3D Heart from particles ─── */
function buildHeartParticles() {
  const N = 4000;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const sz  = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    // Parametric 3D heart
    const t = rnd(0, PI2);
    const u = rnd(-1, 1);
    const scale = 90;
    // Heart curve in XY + sphere for Z depth
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    const hz = rnd(-18, 18) * (1 - Math.abs(u));
    pos[i*3]   = hx * (scale/16) + rnd(-6, 6);
    pos[i*3+1] = hy * (scale/16) + 260 + rnd(-6, 6); // above galaxy
    pos[i*3+2] = hz + rnd(-8, 8);
    const h = 0.88 + rnd(-.05, .08);
    const c = new THREE.Color().setHSL(h%1, 1, rnd(.65, .9));
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    sz[i] = rnd(1.5, 5);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sz,  1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader:`
      attribute float size; attribute vec3 color; varying vec3 vCol;
      uniform float uTime;
      void main(){
        vCol=color;
        float pulse=1.+.18*sin(uTime*2.8);
        vec4 mv=modelViewMatrix*vec4(position,1.);
        gl_PointSize=size*pulse*(340./-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying vec3 vCol;
      void main(){
        float d=length(gl_PointCoord-.5)*2.; if(d>1.)discard;
        float core=1.-smoothstep(0.,.5,d);
        float glow=1.-smoothstep(.3,1.,d);
        gl_FragColor=vec4(vCol+vec3(glow*.5), core+glow*.4);
      }`,
    transparent:true, vertexColors:true, depthWrite:false, blending:THREE.AdditiveBlending
  });
  heartMesh = new THREE.Points(geo, mat);
  threeScene.add(heartMesh);
}

/* ─── Floating photo frames ─── */
const FLOAT_PHRASES = ['you mean everything','only you','stay with me','my favorite person','my safe place','always on my mind','forever'];
function makePhotoSprite(imgUrl, label, cardIdx) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      // Card canvas: 260 x 320
      const cv = document.createElement('canvas');
      cv.width = 260; cv.height = 340;
      const ctx = cv.getContext('2d');

      // Background + glow border
      ctx.fillStyle = 'rgba(20,0,40,.82)';
      roundRect(ctx, 0, 0, 260, 340, 20);
      ctx.fill();

      // Glow border
      ctx.save();
      ctx.shadowColor = '#ff6eb4'; ctx.shadowBlur = 24;
      ctx.strokeStyle = 'rgba(255,110,180,.7)';
      ctx.lineWidth = 3;
      roundRect(ctx, 2, 2, 256, 336, 18);
      ctx.stroke();
      ctx.restore();

      // Photo (clipped rounded)
      ctx.save();
      roundRect(ctx, 10, 10, 240, 240, 14);
      ctx.clip();
      ctx.drawImage(img, 10, 10, 240, 240);
      ctx.restore();

      // Label text
      ctx.save();
      ctx.shadowColor = '#ff6eb4'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#ffcce8';
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, 130, 270, 220);
      ctx.restore();

      const tex = new THREE.CanvasTexture(cv);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sp  = new THREE.Sprite(mat);
      sp.scale.set(90, 117, 1);
      sp.userData.cardIdx = cardIdx;
      resolve(sp);
    };
    img.onerror = () => {
      // Placeholder if image fails to load
      const cv = document.createElement('canvas');
      cv.width = 260; cv.height = 340;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = 'rgba(20,0,40,.9)';
      roundRect(ctx, 0, 0, 260, 340, 20); ctx.fill();
      ctx.fillStyle = '#ff6eb4';
      ctx.font = 'bold 60px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('💖', 130, 140);
      ctx.fillStyle = '#ffcce8'; ctx.font = 'bold 18px Arial';
      ctx.fillText(label, 130, 270);
      const tex = new THREE.CanvasTexture(cv);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sp  = new THREE.Sprite(mat);
      sp.scale.set(90, 117, 1);
      sp.userData.cardIdx = cardIdx;
      resolve(sp);
    };
    img.src = imgUrl;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function buildFloatingPhotos() {
  const total = CONFIG.floatingPhotos.length;
  CONFIG.floatingPhotos.forEach((url, i) => {
    const phrase = FLOAT_PHRASES[i % FLOAT_PHRASES.length];
    const cardIdx = i % CONFIG.popupCards.length;
    makePhotoSprite(url, phrase, cardIdx).then(sp => {
      const angle = (i / total) * PI2;
      const r = rnd(180, 360);
      sp.position.set(
        Math.cos(angle) * r + rnd(-60, 60),
        rnd(-200, 200),
        Math.sin(angle) * r + rnd(-60, 60)
      );
      sp.userData.vy      = rnd(0.15, 0.45);
      sp.userData.yOrigin = sp.position.y;
      sp.userData.yOffset = rnd(0, PI2);
      threeScene.add(sp);
      floatingFrames.push(sp);
      clickableObjects.push(sp);
    });
  });
}

/* ─── Pointer / Drag / Click ─── */
function onPointerDown(e) {
  isPointerDown = true; isDragging = false;
  prevMouse.x = e.clientX; prevMouse.y = e.clientY;
}
function onPointerMove3D(e) {
  // Update threeMouse for raycaster hover
  threeMouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  threeMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  if (!isPointerDown) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;
  if (isDragging) {
    camTheta -= dx * 0.005;
    camPhi    = clamp(camPhi - dy * 0.004, 0.1, Math.PI * 0.8);
  }
  prevMouse.x = e.clientX; prevMouse.y = e.clientY;
}
function onPointerUp() { isPointerDown = false; }

function onCanvasClick(e) {
  if (isDragging) return;
  const r = new THREE.Raycaster();
  const m = new THREE.Vector2(
    (e.clientX / window.innerWidth)  * 2 - 1,
   -(e.clientY / window.innerHeight) * 2 + 1
  );
  r.setFromCamera(m, threeCamera);
  const hits = r.intersectObjects(clickableObjects, false);
  if (hits.length > 0) {
    const obj = hits[0].object;
    if (obj.userData.cardIdx !== undefined) {
      showPopup(obj.userData.cardIdx);
    }
  }
}

/* ─── Pop-up ─── */
function showPopup(idx) {
  const card = CONFIG.popupCards[idx];
  $('popup-img').src    = card.image;
  $('popup-title').textContent = card.title;
  $('popup-text').textContent  = card.text;
  $('popup-overlay').classList.add('visible');
}
$('popup-close').addEventListener('click', () => {
  $('popup-overlay').classList.remove('visible');
});
$('popup-overlay').addEventListener('click', e => {
  if (e.target === $('popup-overlay')) $('popup-overlay').classList.remove('visible');
});

/* ─── Resize ─── */
function onWindowResize() {
  threeCamera.aspect = window.innerWidth / window.innerHeight;
  threeCamera.updateProjectionMatrix();
  threeRenderer.setSize(window.innerWidth, window.innerHeight);
}

/* ─── Render loop ─── */
let threeTime = 0;
function render3D() {
  requestAnimationFrame(render3D);
  threeTime += 0.016;

  // Camera orbit
  const scrollOffset = scrollRatio * 80;
  const cx = Math.sin(camTheta) * Math.sin(camPhi) * camRadius;
  const cy = Math.cos(camPhi) * camRadius - scrollOffset * 0.5 + Math.sin(threeTime * .12) * 15;
  const cz = Math.cos(camTheta) * Math.sin(camPhi) * camRadius;
  threeCamera.position.set(cx, cy, cz);
  threeCamera.lookAt(0, 100, 0);
  // Auto slow drift
  camTheta += 0.0015;

  // Color shifting
  colorShiftT += 0.008;
  const cRatio = (Math.sin(colorShiftT) + 1) / 2; // 0→1

  // Update nebula color
  threeScene.children.forEach(c => {
    if (c.userData.isNebula) {
      const col = new THREE.Color().setHSL(0.75 + cRatio * 0.2, 0.9, 0.25);
      c.material.uniforms.uColor.value = col;
      c.material.uniforms.uTime.value  = threeTime;
    }
    if (c instanceof THREE.Points) {
      if (c.material.uniforms.uTime) c.material.uniforms.uTime.value = threeTime;
    }
  });

  // Galaxy rotate
  if (galaxyMesh) galaxyMesh.rotation.y = threeTime * 0.08;

  // Heart pulse/spin
  if (heartMesh) {
    heartMesh.rotation.y = threeTime * 0.15;
    heartMesh.material.uniforms.uTime.value = threeTime;
  }

  // Orbit text sprites
  orbitTextSprites.forEach(sp => {
    sp.userData.orbitAngle += 0.006;
    const a = sp.userData.orbitAngle;
    const r = sp.userData.orbitRadius;
    sp.position.set(
      Math.cos(a) * r,
      sp.userData.orbitHeight + Math.sin(threeTime * .5 + a) * 15,
      Math.sin(a) * r
    );
    // Opacity flicker
    sp.material.opacity = 0.75 + 0.25 * Math.sin(threeTime * 2 + sp.userData.orbitAngle);
  });

  // Floating photo frames — anti-gravity float
  floatingFrames.forEach(sp => {
    sp.position.y += Math.sin(threeTime * sp.userData.vy + sp.userData.yOffset) * 0.5;
    // Wrap vertically
    if (sp.position.y > 350)  sp.position.y = -350;
    if (sp.position.y < -350) sp.position.y =  350;
    // Gentle wobble on X/Z
    sp.position.x += Math.cos(threeTime * 0.3 + sp.userData.yOffset) * 0.1;
    sp.position.z += Math.sin(threeTime * 0.25 + sp.userData.yOffset) * 0.1;
  });

  threeRenderer.render(threeScene, threeCamera);
}

/* ════════════════════════════════════════════════════════
   STORYLINE — dibuat dari CONFIG.storylineData
════════════════════════════════════════════════════════ */
function buildStoryline() {
  const wrap = $('timeline-wrap');
  // Keep the line element
  const line = wrap.querySelector('.timeline-line');

  CONFIG.storylineData.forEach((item, i) => {
    const side = i % 2 === 0 ? 'left' : 'right';
    const card = document.createElement('div');
    card.className = `story-card ${side}`;
    card.innerHTML = `
      <span class="story-badge">${item.chapter}</span>
      <div class="story-img-wrap">
        <img class="story-img" src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.style.display='none'" />
      </div>
      <div class="story-title">${item.title}</div>
      <p class="story-text">${item.story}</p>
    `;
    wrap.appendChild(card);
  });
}

/* ════════════════════════════════════════════════════════
   ENDING — heart rain particles
════════════════════════════════════════════════════════ */
function buildEnding() {
  const section = $('ending-section');
  const HEARTS = ['💖','💗','💓','💞','❤️','🌸','✨','⭐','🌙'];
  for (let i = 0; i < 28; i++) {
    const h = document.createElement('div');
    h.className = 'heart-particle';
    h.textContent = HEARTS[Math.floor(rnd(0, HEARTS.length))];
    h.style.cssText = `
      left:${rnd(0,100)}%;
      animation-duration:${rnd(4,8)}s;
      animation-delay:${rnd(0,5)}s;
      font-size:${rnd(14,30)}px;
    `;
    $('ending-card').appendChild(h);
  }

  $('btn-top').addEventListener('click', e => {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

/* ════════════════════════════════════════════════════════
   GSAP SCROLLTRIGGER — story cards + parallax
════════════════════════════════════════════════════════ */
function initScrollTrigger() {
  gsap.registerPlugin(ScrollTrigger);

  // Parallax camera tilt with scroll
  ScrollTrigger.create({
    trigger: '#story-section',
    start: 'top bottom',
    end: 'bottom top',
    onUpdate: self => {
      scrollRatio = self.progress;
    }
  });

  // Story cards fade in
  document.querySelectorAll('.story-card').forEach((card, i) => {
    const isLeft = card.classList.contains('left');
    gsap.to(card, {
      scrollTrigger: {
        trigger: card,
        start: 'top 88%',
        toggleActions: 'play none none none'
      },
      opacity: 1,
      x: 0,
      duration: .9,
      delay: i * 0.06,
      ease: 'power3.out'
    });
  });

  // Ending card
  gsap.fromTo('#ending-card',
    { opacity: 0, y: 60 },
    {
      scrollTrigger: {
        trigger: '#ending-section',
        start: 'top 80%',
        toggleActions: 'play none none none'
      },
      opacity: 1, y: 0, duration: 1.1, ease: 'power3.out'
    }
  );
}

/* ════════════════════════════════════════════════════════
   CANVAS POINTER EVENTS — allow both 3D drag & page scroll
   (only block default in hero section)
════════════════════════════════════════════════════════ */
const heroSection = $('hero-section');
heroSection.addEventListener('touchstart', e => {
  // One finger = scroll, two fingers or explicit drag = 3D
  if (e.touches.length === 1) {
    // Allow scroll, also track for 3D drag
    isPointerDown = true; isDragging = false;
    prevMouse.x = e.touches[0].clientX;
    prevMouse.y = e.touches[0].clientY;
  }
}, { passive: true });
heroSection.addEventListener('touchmove', e => {
  if (e.touches.length === 1) {
    const dx = e.touches[0].clientX - prevMouse.x;
    const dy = e.touches[0].clientY - prevMouse.y;
    if (Math.abs(dx) > Math.abs(dy) + 5) {
      // Horizontal = 3D rotate, prevent scroll
      e.preventDefault();
      isDragging = true;
      camTheta -= dx * 0.005;
      prevMouse.x = e.touches[0].clientX;
      prevMouse.y = e.touches[0].clientY;
    }
    // Vertical = let scroll pass through
  }
}, { passive: false });
heroSection.addEventListener('touchend', () => { isPointerDown = false; });

</script>
