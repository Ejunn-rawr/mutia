<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Galaksi Cinta untuk Mutia 💖</title>

<!-- ═══════════════════════════════════════════════════════════
     IMPORTMAP — Three.js r160 + OrbitControls via ESM
     WAJIB type="importmap" agar OrbitControls bisa di-import
═══════════════════════════════════════════════════════════ -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<!-- GSAP dimuat SEBELUM module script agar tersedia global -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
/* ═══════════════════════════════════════════
   RESET & ROOT
═══════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --pink:    #ff6eb4;
  --magenta: #ff2d9b;
  --cyan:    #00f5ff;
  --purple:  #bf5fff;
  --gold:    #ffd700;
  --deep:    #03000f;
}

html, body {
  width: 100%; height: 100%;
  /* overflow HIDDEN saat mode 3D agar OrbitControls tidak konflik scroll */
  overflow: hidden;
  background: var(--deep);
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: #fff;
  cursor: none;
}
body.story-open {
  /* Dibuka saat panel cerita slide-up, scroll tetap dihandle di dalam panel */
  overflow: hidden;
}

/* ═══════════════════════════════════════════
   CANVAS 3D — WAJIB pointer-events: auto
   agar OrbitControls 360° berfungsi penuh!
═══════════════════════════════════════════ */
#three-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
  pointer-events: auto; /* ← KUNCI OrbitControls */
  display: block;
}

/* ═══════════════════════════════════════════
   CURSOR CUSTOM
═══════════════════════════════════════════ */
#cursor-ring {
  position: fixed; width: 30px; height: 30px;
  border: 2px solid var(--pink); border-radius: 50%;
  pointer-events: none; z-index: 99999;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 12px var(--pink);
  transition: width .15s, height .15s;
}
#cursor-dot {
  position: fixed; width: 6px; height: 6px;
  background: var(--cyan); border-radius: 50%;
  pointer-events: none; z-index: 99999;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 8px var(--cyan);
}
.trail-p {
  position: fixed; pointer-events: none; z-index: 99998;
  border-radius: 50%;
  animation: trail-fade .8s ease-out forwards;
}
@keyframes trail-fade {
  0%   { opacity:.9; transform:scale(1) translate(0,0); }
  100% { opacity:0;  transform:scale(0) translate(var(--tx),var(--ty)); }
}

/* ═══════════════════════════════════════════
   LOADING SCREEN
═══════════════════════════════════════════ */
#loading-screen {
  position: fixed; inset: 0;
  background: #000;
  z-index: 10000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px;
  pointer-events: auto;
}
.load-heart {
  font-size: clamp(56px,12vw,90px);
  animation: hbeat 1s ease-in-out infinite;
  filter: drop-shadow(0 0 24px var(--pink)) drop-shadow(0 0 50px var(--magenta));
}
@keyframes hbeat {
  0%,100%{ transform:scale(1); }
  14%    { transform:scale(1.28); }
  28%    { transform:scale(1); }
  42%    { transform:scale(1.2); }
}
.load-title {
  font-size: clamp(12px,3vw,17px);
  letter-spacing: 6px; text-transform: uppercase;
  color: var(--pink); text-shadow: 0 0 20px var(--pink);
}
.load-bar-wrap {
  width: clamp(200px,50vw,340px); height: 3px;
  background: rgba(255,255,255,.1); border-radius: 10px; overflow: hidden;
}
.load-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--pink), var(--cyan));
  border-radius: 10px;
  box-shadow: 0 0 10px var(--pink);
}
.load-dots { display:flex; gap:8px; }
.load-dot {
  width:8px; height:8px; background:var(--pink);
  border-radius:50%; box-shadow:0 0 8px var(--pink);
  animation: dbounce 1.4s ease-in-out infinite;
}
.load-dot:nth-child(2){ animation-delay:.2s; }
.load-dot:nth-child(3){ animation-delay:.4s; }
@keyframes dbounce {
  0%,80%,100%{ transform:scale(.8); opacity:.5; }
  40%        { transform:scale(1.3); opacity:1; }
}

/* ═══════════════════════════════════════════
   INTRO SCREEN
═══════════════════════════════════════════ */
#intro-screen {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, #0d002a 0%, #000 100%);
  z-index: 9999;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; padding: 24px; text-align: center;
  opacity: 0; pointer-events: none;
}
.intro-emoji {
  font-size: clamp(60px,13vw,110px);
  animation: float-e 3.5s ease-in-out infinite;
  filter: drop-shadow(0 0 30px var(--pink)) drop-shadow(0 0 70px var(--magenta));
}
@keyframes float-e {
  0%,100%{ transform:translateY(0); }
  50%    { transform:translateY(-20px); }
}
.intro-title {
  font-size: clamp(22px,6vw,54px); font-weight:900; line-height:1.2;
  background: linear-gradient(135deg,#fff,var(--pink),var(--cyan));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.intro-sub {
  font-size: clamp(11px,2.5vw,15px);
  letter-spacing:5px; text-transform:uppercase;
  color: var(--cyan); text-shadow: 0 0 16px var(--cyan);
}
.intro-deco {
  font-size: clamp(16px,3.5vw,24px);
  animation: spin-d 10s linear infinite;
  display:block;
  filter: drop-shadow(0 0 8px gold);
}
@keyframes spin-d{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.btn-enter {
  margin-top:10px;
  padding: clamp(12px,2vw,18px) clamp(30px,6vw,56px);
  background: linear-gradient(135deg, var(--magenta), var(--purple));
  border:none; border-radius:50px;
  font-size: clamp(13px,2.5vw,18px); font-weight:700;
  color:#fff; cursor:pointer; letter-spacing:1px;
  box-shadow: 0 0 32px rgba(255,45,155,.65), 0 0 64px rgba(255,45,155,.2);
  animation: pbtn 2s ease-in-out infinite;
  transition: transform .2s;
}
.btn-enter:hover{ transform:scale(1.07); }
@keyframes pbtn {
  0%,100%{ box-shadow:0 0 32px rgba(255,45,155,.65),0 0 64px rgba(255,45,155,.2); }
  50%    { box-shadow:0 0 50px rgba(0,245,255,.7),0 0 80px rgba(0,245,255,.3); }
}

/* ═══════════════════════════════════════════
   WARP OVERLAY (transisi antar scene)
═══════════════════════════════════════════ */
#warp-overlay {
  position: fixed; inset:0; z-index:9000;
  background:#000; display:none;
  pointer-events: none;
}
#warp-canvas { width:100%; height:100%; display:block; }

/* ═══════════════════════════════════════════
   UI LAYER — pointer-events: none!
   Anak elemen .ui-btn punya pointer-events: auto
═══════════════════════════════════════════ */
#ui-layer {
  position: fixed; inset:0;
  z-index: 10;
  pointer-events: none; /* ← WAJIB: tidak menghalangi canvas */
}
.ui-btn {
  pointer-events: auto; /* ← tombol tetap bisa diklik */
  cursor: pointer;
  border: none; border-radius: 50px;
  font-weight: 700; letter-spacing: 1px;
  transition: transform .2s, box-shadow .2s;
}
.ui-btn:hover{ transform:scale(1.07); }

/* Tombol "Buka Kenangan Kita" — bawah tengah, scene 1 */
#btn-memories {
  position: absolute;
  bottom: 32px; left: 50%;
  transform: translateX(-50%);
  padding: clamp(12px,1.8vw,16px) clamp(24px,4vw,44px);
  font-size: clamp(13px,2.2vw,16px);
  background: linear-gradient(135deg, var(--magenta), var(--purple), var(--cyan));
  background-size: 200% 200%;
  color: #fff;
  box-shadow: 0 0 30px rgba(255,45,155,.6);
  animation: gbtn 3s ease infinite, fbtn 4s ease-in-out infinite;
  display: none;
}
@keyframes gbtn {
  0%,100%{ background-position:0% 50%; }
  50%    { background-position:100% 50%; }
}
@keyframes fbtn {
  0%,100%{ transform:translateX(-50%) translateY(0); }
  50%    { transform:translateX(-50%) translateY(-8px); }
}

/* Tombol "← Kembali ke Galaksi" — atas kiri, scene 2 */
#btn-back {
  position: absolute;
  top: 20px; left: 20px;
  padding: 10px 20px;
  font-size: clamp(12px,2vw,14px);
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,110,180,.4);
  color: var(--pink);
  box-shadow: 0 0 16px rgba(255,45,155,.2);
  display: none;
}

/* Tombol "Lihat Cerita Kita" — bawah kanan, scene 2 */
#btn-story {
  position: absolute;
  bottom: 32px; right: 24px;
  padding: clamp(10px,1.5vw,14px) clamp(18px,3vw,30px);
  font-size: clamp(12px,2vw,14px);
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff;
  box-shadow: 0 0 20px rgba(191,95,255,.5);
  display: none;
}

/* Mute button — pojok kanan bawah (selalu tampil setelah enter) */
#btn-mute {
  position: absolute;
  bottom: 32px; right: 24px;
  width: 48px; height: 48px;
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 50% !important;
  font-size: 22px;
  display: none;
  align-items: center; justify-content: center;
  pointer-events: auto;
  cursor: pointer;
  box-shadow: 0 0 14px rgba(255,110,180,.3);
}

/* Label scene di atas kanan */
#scene-label {
  position: absolute;
  top: 20px; right: 20px;
  font-size: clamp(10px,1.8vw,12px);
  letter-spacing: 3px; text-transform: uppercase;
  color: rgba(255,255,255,.4);
  pointer-events: none;
}

/* ═══════════════════════════════════════════
   POPUP MODAL (glassmorphism kartu romantis)
═══════════════════════════════════════════ */
#popup-overlay {
  position: fixed; inset:0;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(8px);
  z-index: 8000;
  display: flex; align-items:center; justify-content:center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
#popup-overlay.open{ opacity:1; pointer-events:auto; }
.popup-card {
  background: linear-gradient(135deg,rgba(30,0,60,.9),rgba(0,10,45,.9));
  border: 1px solid rgba(255,110,180,.25);
  border-radius: 24px; padding: 28px 22px;
  max-width: 420px; width: 100%; text-align:center;
  box-shadow: 0 0 60px rgba(255,45,155,.4), 0 0 120px rgba(0,245,255,.08);
  transform: scale(.85);
  transition: transform .35s cubic-bezier(.34,1.56,.64,1);
}
#popup-overlay.open .popup-card{ transform:scale(1); }
.popup-img {
  width:100%; max-height:210px; object-fit:cover;
  border-radius:14px; margin-bottom:14px;
  border:2px solid rgba(255,110,180,.4);
  box-shadow:0 0 22px rgba(255,110,180,.3);
}
.popup-title {
  font-size:clamp(16px,3.5vw,22px); font-weight:800;
  background: linear-gradient(90deg,var(--pink),var(--cyan));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:10px;
}
.popup-text {
  font-size:clamp(13px,2.5vw,15px); color:rgba(255,255,255,.85);
  line-height:1.75; margin-bottom:20px; font-style:italic;
}
.popup-close-btn {
  padding:10px 28px;
  background: linear-gradient(135deg, var(--magenta), var(--purple));
  border:none; border-radius:50px;
  color:#fff; font-size:14px; font-weight:700;
  cursor:pointer;
  box-shadow:0 0 20px rgba(255,45,155,.5);
  transition:transform .2s;
}
.popup-close-btn:hover{ transform:scale(1.06); }

/* ═══════════════════════════════════════════
   STORY PANEL — slide-up dari bawah
═══════════════════════════════════════════ */
#story-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 88vh;
  z-index: 500;
  background: linear-gradient(180deg, rgba(5,0,20,.97) 0%, #03000f 100%);
  border-radius: 24px 24px 0 0;
  border-top: 1px solid rgba(255,110,180,.35);
  box-shadow: 0 -20px 80px rgba(255,45,155,.25);
  transform: translateY(100%);
  transition: transform .55s cubic-bezier(.4,0,.2,1);
  overflow-y: auto;
  padding: 28px 0 60px;
  pointer-events: none;
}
#story-panel.open{
  transform: translateY(0);
  pointer-events: auto;
}
.story-panel-header {
  display:flex; align-items:center; justify-content:space-between;
  padding: 0 clamp(16px,4vw,40px) 24px;
  border-bottom: 1px solid rgba(255,255,255,.06);
  margin-bottom: 32px;
}
.story-panel-title {
  font-size:clamp(16px,3.5vw,22px); font-weight:800;
  background:linear-gradient(90deg,var(--pink),var(--cyan));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.btn-close-story {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 50px;
  color: rgba(255,255,255,.7);
  font-size: 13px; padding: 8px 18px;
  cursor: pointer;
  transition: background .2s;
}
.btn-close-story:hover{ background:rgba(255,110,180,.2); }

/* Story cards grid */
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(clamp(260px,40vw,380px), 1fr));
  gap: clamp(16px,3vw,28px);
  padding: 0 clamp(16px,4vw,40px);
}
.story-card {
  background: linear-gradient(135deg,rgba(30,0,60,.7),rgba(0,10,40,.7));
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,110,180,.2);
  border-radius: 20px; overflow:hidden;
  box-shadow: 0 0 24px rgba(255,45,155,.08);
  transition: box-shadow .3s, transform .3s;
}
.story-card:hover{
  box-shadow: 0 0 50px rgba(255,45,155,.25);
  transform: translateY(-4px);
}
.story-card img {
  width:100%; height: clamp(160px,28vw,230px);
  object-fit:cover; display:block;
  transition: transform .5s;
}
.story-card:hover img{ transform:scale(1.06); }
.story-card-body{ padding:18px 16px 20px; }
.story-badge {
  display:inline-block;
  padding:4px 14px; margin-bottom:10px;
  background:linear-gradient(90deg,var(--magenta),var(--purple));
  border-radius:50px; font-size:11px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase;
  box-shadow:0 0 12px rgba(255,45,155,.5);
}
.story-title {
  font-size:clamp(14px,3vw,18px); font-weight:700;
  background:linear-gradient(90deg,var(--pink),var(--cyan));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:8px;
}
.story-text {
  font-size:clamp(12px,2vw,14px); color:rgba(255,255,255,.8);
  line-height:1.75; font-style:italic;
}

/* Ending di dalam story panel */
.story-ending {
  margin: 40px clamp(16px,4vw,40px) 0;
  background:linear-gradient(135deg,rgba(40,0,80,.8),rgba(0,15,50,.8));
  border:1px solid rgba(255,110,180,.3);
  border-radius:24px; padding:clamp(28px,5vw,50px);
  text-align:center;
  box-shadow:0 0 60px rgba(255,45,155,.2);
  position:relative; overflow:hidden;
}
.ending-hearts{
  position:absolute; inset:0; pointer-events:none; overflow:hidden;
}
.eh {
  position:absolute; top:-40px;
  font-size: clamp(16px,3vw,28px);
  animation: efall linear infinite;
  pointer-events:none;
}
@keyframes efall {
  0%  { transform:translateY(0) rotate(0deg); opacity:.9; }
  100%{ transform:translateY(120vh) rotate(360deg); opacity:0; }
}
.ending-title {
  font-size:clamp(22px,5.5vw,46px); font-weight:900;
  background:linear-gradient(135deg,#fff,var(--pink),var(--cyan));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:14px; position:relative; z-index:1;
}
.ending-sub {
  font-size:clamp(13px,2.2vw,16px);
  color:rgba(255,255,255,.75); line-height:1.8;
  margin-bottom:24px; position:relative; z-index:1;
}
.btn-back-top {
  padding: clamp(12px,1.8vw,16px) clamp(28px,5vw,50px);
  background: linear-gradient(135deg,var(--pink),var(--purple),var(--cyan));
  background-size:200% 200%;
  border:none; border-radius:50px;
  color:#fff; font-size:clamp(13px,2.2vw,16px); font-weight:700;
  cursor:pointer; letter-spacing:1px;
  box-shadow:0 0 28px rgba(255,45,155,.5);
  animation:gbtn 4s ease infinite;
  transition:transform .2s;
  position:relative; z-index:1;
}
.btn-back-top:hover{ transform:scale(1.06); }
</style>
</head>
<body>

<!-- ─── Custom Cursor ─── -->
<div id="cursor-ring"></div>
<div id="cursor-dot"></div>

<!-- ─── TAHAP 1: Loading Screen ─── -->
<div id="loading-screen">
  <div class="load-heart">💖</div>
  <div class="load-title">Loading Memories...</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-dots">
    <div class="load-dot"></div>
    <div class="load-dot"></div>
    <div class="load-dot"></div>
  </div>
</div>

<!-- ─── TAHAP 1: Intro Screen ─── -->
<div id="intro-screen">
  <span class="intro-deco">⭐ 💖 🌸 ✨ 🌙 💫 🌟</span>
  <div class="intro-emoji">🌌</div>
  <h1 class="intro-title">Galaksi Cinta<br>untuk Mutia</h1>
  <p class="intro-sub">Dari Ejunn untuk Mutia</p>
  <button class="btn-enter" id="btn-enter">Lihat lebih lanjut yukk 🚀</button>
</div>

<!-- ─── Warp Overlay (transisi antar scene) ─── -->
<div id="warp-overlay">
  <canvas id="warp-canvas"></canvas>
</div>

<!-- ─── THREE.JS CANVAS — pointer-events: auto WAJIB ─── -->
<canvas id="three-canvas"></canvas>

<!-- ─── UI LAYER — pointer-events: none (pass-through ke canvas) ─── -->
<div id="ui-layer">
  <div id="scene-label">🌌 Galaksi Cinta</div>

  <!-- Scene 1: tombol masuk ke ruang foto -->
  <button class="ui-btn" id="btn-memories">Buka Kenangan Kita ✨<br><small style="font-weight:400;font-size:.8em;letter-spacing:0">(Masuk ke Ruang Foto)</small></button>

  <!-- Scene 2: tombol kembali ke galaksi -->
  <button class="ui-btn" id="btn-back">← Kembali ke Galaksi Love</button>

  <!-- Scene 2: tombol buka cerita -->
  <button class="ui-btn" id="btn-story">Lihat Cerita Kita 💖</button>

  <!-- Mute button -->
  <button id="btn-mute">🔊</button>
</div>

<!-- ─── Pop-up Kartu Romantis ─── -->
<div id="popup-overlay">
  <div class="popup-card">
    <img id="popup-img" src="" alt="foto" />
    <div class="popup-title" id="popup-title"></div>
    <div class="popup-text"  id="popup-text"></div>
    <button class="popup-close-btn" id="popup-close">KEMBALI ❤️</button>
  </div>
</div>

<!-- ─── Story Panel (slide-up dari bawah) ─── -->
<div id="story-panel">
  <div class="story-panel-header">
    <div class="story-panel-title">📖 Cerita Kita, Mutia 💖</div>
    <button class="btn-close-story" id="btn-close-story">✕ Tutup</button>
  </div>
  <div class="story-grid" id="story-grid">
    <!-- diisi JS dari CONFIG.storylineData -->
  </div>
  <!-- Ending di bawah story grid -->
  <div class="story-ending" id="story-ending">
    <div class="ending-hearts" id="ending-hearts"></div>
    <div class="ending-title">Mutia ❤️ Ejunn Forever</div>
    <div class="ending-sub">
      Terima kasih sudah jadi bagian terbaik dari hari-hariku.<br>
      Kamu segalanya, Mutia 🌌✨
    </div>
    <button class="btn-back-top" id="btn-back-top">Tutup & Kembali ke Galaksi ↑</button>
  </div>
</div>

<!-- ─── Audio ─── -->
<audio id="bg-music" loop preload="auto"></audio>

<!-- ═══════════════════════════════════════════════════════════
     MAIN MODULE SCRIPT
     type="module" wajib agar bisa import Three.js + OrbitControls
═══════════════════════════════════════════════════════════ -->
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ════════════════════════════════════════════════════════
   ██████╗ ██████╗ ███╗   ██╗███████╗██╗ ██████╗
   KONFIGURASI UTAMA — UBAH DATA DI SINI SAJA!
════════════════════════════════════════════════════════ */
const CONFIG = {

  /* ── File musik latar (path relatif dari folder ini) ── */
  musicUrl: './lagu.mp3.mpeg',

  /* ── Daftar foto yang melayang di Ruang Foto 3D ── */
  photos: [
    './foto1.jpeg',
    './foto2.jpeg',
    './foto3.jpeg',

const PI2  = Math.PI * 2;
const rnd  = (a, b) => Math.random() * (b - a) + a;
const clamp= (v, lo, hi) => Math.max(lo, Math.min(hi, v));

let mX=0, mY=0, rX=0, rY=0, trailN=0;
const cRing = $('cursor-ring');
const cDot  = $('cursor-dot');
const TCOLORS = ['#ff6eb4','#bf5fff','#00f5ff','#ff2d9b','#ffd700','#a8ff78'];

function onPointerPos(x, y) {
  mX = x; mY = y; spawnTrail(x, y);
}
window.addEventListener('mousemove', e => onPointerPos(e.clientX, e.clientY));
window.addEventListener('touchmove', e => {
  const t = e.touches[0];
  onPointerPos(t.clientX, t.clientY);
}, { passive: true });

function spawnTrail(x, y) {
  if (trailN > 55) return;
  trailN++;
  const el = document.createElement('div');
  el.className = 'trail-p';
  const sz  = rnd(4, 10);
  const col = TCOLORS[Math.floor(rnd(0, TCOLORS.length))];
  el.style.cssText = `
    width:${sz}px;height:${sz}px;background:${col};
    left:${x}px;top:${y}px;
    box-shadow:0 0 ${sz*2}px ${col};
    --tx:${rnd(-28,28)}px;--ty:${rnd(-28,28)}px;
    animation-duration:${rnd(.5,1.1)}s;
  `;
  document.body.appendChild(el);
  el.addEventListener('animationend', () => { el.remove(); trailN--; });
}
(function cursorLoop() {
  rX += (mX - rX) * .12; rY += (mY - rY) * .12;
  cRing.style.left = rX + 'px'; cRing.style.top = rY + 'px';
  cDot.style.left  = mX + 'px'; cDot.style.top  = mY + 'px';
  requestAnimationFrame(cursorLoop);
})();

function makeTextSprite(text, opts = {}) {
  const fontSize = opts.fontSize || 40;
  const width    = opts.width    || 600;
  const height   = opts.height   || 96;
  const color    = opts.color    || '#ffffff';
  const glow     = opts.glow     || '#ff6eb4';

  const cv  = document.createElement('canvas');
  cv.width  = width; cv.height = height;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, width, height);
  ctx.shadowColor = glow; ctx.shadowBlur = 28;
  ctx.fillStyle   = color;
  ctx.font        = `bold ${fontSize}px Arial`;
  ctx.textAlign   = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, width / 2, height / 2, width - 20);
  ctx.shadowBlur  = 12; ctx.fillStyle = '#fff';
  ctx.fillText(text, width / 2, height / 2, width - 20);

  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const sp  = new THREE.Sprite(mat);
  sp.scale.set(width * 0.35, height * 0.35, 1);
  return sp;
}

function makeIconSprite(emoji, size = 80) {

/* ─── Nebula background shader (Scene 1) ─── */
function buildNebula1() {
  const geo = new THREE.PlaneGeometry(4000, 4000);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:  { value: 0 },
      uColor1:{ value: new THREE.Color(0.22, 0.01, 0.42) },
      uColor2:{ value: new THREE.Color(0.55, 0.12, 0.30) }
    },
    vertexShader: `
      varying vec2 vUv;
      void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }
    `,
    fragmentShader: `
      uniform float uTime; uniform vec3 uColor1, uColor2;
      varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float noise(vec2 p){
        vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
      }
      void main(){
        vec2 uv=vUv-.5;
        float n=noise(uv*2.8+uTime*.025)*.5+noise(uv*5.5-uTime*.018)*.3+noise(uv*11.)*.2;
        vec3 deep=vec3(.01,.00,.05);
        vec3 col=mix(deep,mix(uColor1,uColor2,n),n*.7);
        float v=1.-dot(uv*1.5,uv*1.5); col*=clamp(v,.0,1.);
        gl_FragColor=vec4(col,1.);
      }
    `,
    depthWrite: false, side: THREE.DoubleSide
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.z = -1500;
  m.userData.type = 'nebula1';
  scene1.add(m);
  return mat;
}

/* ─── Star field ─── */
function buildStars(scene, count, zRange) {
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const sz  = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    pos[i*3]   = rnd(-1400, 1400);
    pos[i*3+1] = rnd(-1400, 1400);
    pos[i*3+2] = rnd(zRange[0], zRange[1]);
    const c = new THREE.Color().setHSL(rnd(0,1), .8, rnd(.6,1));
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    sz[i] = rnd(.5, 3.2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sz,  1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float size; attribute vec3 color; varying vec3 vCol;
      uniform float uTime;
      void main(){
        vCol=color;
        vec3 p=position; p.z+=sin(uTime*.25+p.x*.008)*6.;
        vec4 mv=modelViewMatrix*vec4(p,1.);
        gl_PointSize=size*(260./-mv.z); gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader: `
      varying vec3 vCol;
      void main(){
        float d=length(gl_PointCoord-.5)*2.; if(d>1.)discard;
        gl_FragColor=vec4(vCol,pow(1.-d,2.5));
      }`,
    transparent:true, vertexColors:true, depthWrite:false, blending:THREE.AdditiveBlending
  });
  mat.userData.isStarMat = true;
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return mat;
}

/* ─── 3D HATI PARTIKEL RAKSASA ─── */
// Rumus parametrik hati 3D:
// x = 16 * sin³(t)
// y = 13*cos(t) - 5*cos(2t) - 2*cos(3t) - cos(4t)
// z: disebar secara volumetrik menggunakan parameter ke-2
let heartMesh1, heartMat1;
function buildHeart3D() {
  const N    = 8000;
  const pos  = new Float32Array(N * 3);
  const col  = new Float32Array(N * 3);
  const sz   = new Float32Array(N);
  const SCALE = 12; // skala → satuan Three.js

  for (let i = 0; i < N; i++) {
    const t = rnd(0, PI2);

    // Koordinat hati 2D (normalized)
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = 13 * Math.cos(t)
              - 5 * Math.cos(2 * t)
              - 2 * Math.cos(3 * t)
              -     Math.cos(4 * t);

    // Untuk kedalaman Z: makin jauh dari sumbu, makin lebar
    const r3d   = Math.sqrt(hx * hx + hy * hy);
    const maxZ  = r3d * 0.35;
    const zOff  = rnd(-maxZ, maxZ);

    // Noise kecil agar partikel tidak persis di garis tepi
    const noise = rnd(-3, 3);

    pos[i * 3]     = hx * (SCALE / 16) + noise;
    pos[i * 3 + 1] = hy * (SCALE / 16) + noise + 30; // geser ke atas galaksi
    pos[i * 3 + 2] = zOff + noise * 0.5;

    // Warna: pink (hue 0.88) ke magenta (hue 0.95)
    const h = 0.87 + rnd(0, 0.09);
    const c = new THREE.Color().setHSL(h % 1, 1, 0.62 + rnd(0, 0.28));
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    sz[i] = rnd(1.8, 5.5);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sz,  1));

  heartMat1 = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float size; attribute vec3 color; varying vec3 vCol;
      uniform float uTime;
      void main(){
        vCol=color;
        // Denyut (pulse) hati
        float pulse=1.0+0.22*sin(uTime*2.6);
        vec3 p=position;
        // Rotasi pelan di Y
        float angle=uTime*0.18;
        float cs=cos(angle),sn=sin(angle);
        p.xz=vec2(p.x*cs-p.z*sn, p.x*sn+p.z*cs);
        vec4 mv=modelViewMatrix*vec4(p,1.);
        gl_PointSize=size*pulse*(360./-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader: `
      varying vec3 vCol;
      void main(){
        float d=length(gl_PointCoord-.5)*2.; if(d>1.)discard;
        float core=1.-smoothstep(.0,.5,d);
        float glow=1.-smoothstep(.3,1.,d);
        gl_FragColor=vec4(vCol+vec3(glow*.55), core*1.+glow*.45);
      }`,
    transparent:true, vertexColors:true, depthWrite:false, blending:THREE.AdditiveBlending
  });

  heartMesh1 = new THREE.Points(geo, heartMat1);
  scene1.add(heartMesh1);
}

/* ─── GALAKSI SPIRAL VORTEX (10.000 partikel) ─── */
let galaxyMesh1, galaxyMat1;
function buildGalaxy() {
  const N   = 10000;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const sz  = new Float32Array(N);

  for (let i = 0; i < N; i++) {
    // 3 lengan spiral
    const arm    = Math.floor(rnd(0, 3));
    const t      = rnd(0.12, 1);
    const radius = t * 280;

    // Rumus pusaran galaksi spiral:
    // x = cos(angle) * radius
    // z = sin(angle) * radius
    const angle  = t * 4.5 * Math.PI + arm * (PI2 / 3) + rnd(-0.3, 0.3);
    const spread = rnd(0, 22) * (1 - t * 0.6);

    pos[i * 3]     = Math.cos(angle) * radius + rnd(-spread, spread);
    pos[i * 3 + 1] = rnd(-10, 10) * (1 - t * 0.7);
    pos[i * 3 + 2] = Math.sin(angle) * radius + rnd(-spread, spread);

    // Gradasi Pink → Cyan mengikuti radius
    const c = new THREE.Color().setHSL(0.84 - t * 0.35, 1, 0.6 + t * 0.22);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    sz[i] = rnd(0.7, 3.8);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sz,  1));

  galaxyMat1 = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float size; attribute vec3 color;
      varying vec3 vCol; varying float vAlpha;
      uniform float uTime;
      void main(){
        vCol=color;
        float pulse=.85+.15*sin(uTime*1.8+position.x*.02);
        vAlpha=.45+.55*sin(uTime*.45+position.z*.015);
        vec4 mv=modelViewMatrix*vec4(position,1.);
        gl_PointSize=size*pulse*(310./-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader: `
      varying vec3 vCol; varying float vAlpha;
      void main(){
        float d=length(gl_PointCoord-.5)*2.; if(d>1.)discard;
        float g=1.-smoothstep(.25,1.,d);
        gl_FragColor=vec4(vCol+vec3(g*.4), (pow(1.-d,2.)+g*.35)*vAlpha);
      }`,
    transparent:true, vertexColors:true, depthWrite:false, blending:THREE.AdditiveBlending
  });

  galaxyMesh1 = new THREE.Points(geo, galaxyMat1);
  scene1.add(galaxyMesh1);
}

const photoFrames = []; // { group, ySpeed, yOfs }
function buildFloatingPhotos() {
  const loader = new THREE.TextureLoader();
  const TOTAL  = 18;

  for (let i = 0; i < TOTAL; i++) {
    const url  = CONFIG.photos[i % CONFIG.photos.length];
    const group= new THREE.Group();

    // ─ Frame (border pink bercahaya) ─
    const frameGeo = new THREE.PlaneGeometry(68, 90);
    const frameMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(1, 0.43, 0.71),
      transparent: true, opacity: 0.55,
      side: THREE.DoubleSide
    });
    group.add(new THREE.Mesh(frameGeo, frameMat));

    // ─ Foto di atasnya ─
    const photoGeo = new THREE.PlaneGeometry(62, 84);
    const photoMat = new THREE.MeshBasicMaterial({
      transparent: true, opacity: 1,
      side: THREE.DoubleSide, color: 0x222244 // placeholder gelap
    });
    loader.load(url, tex => {
      photoMat.map   = tex;
      photoMat.color = new THREE.Color(1,1,1);
      photoMat.needsUpdate = true;
    }, undefined, () => {
      // Error fallback: warna solid berbeda tiap foto
      photoMat.color = new THREE.Color().setHSL(i/TOTAL, .8, .4);
    });
    const photoMesh = new THREE.Mesh(photoGeo, photoMat);
    photoMesh.position.z = 0.8;
    group.add(photoMesh);

    // ─ Posisi acak di sekitar 360° kamera ─
    const r     = rnd(150, 360);
    const theta = rnd(0, PI2);
    const phi   = rnd(0.15, Math.PI - 0.15);
    group.position.set(
      r * Math.sin(phi) * Math.cos(theta),
      rnd(-280, 280),
      r * Math.sin(phi) * Math.sin(theta)
    );
    // Hadap ke pusat (kamera)
    group.lookAt(0, 0, 0);
    group.rotateY(Math.PI); // balik agar muka foto ke arah kamera

    group.userData.ySpeed = rnd(0.18, 0.5);
    group.userData.yOfs   = rnd(0, PI2);
    group.userData.baseY  = group.position.y;

    scene2.add(group);
    photoFrames.push(group);
  }
}

/* ─── Teks melayang di Ruang Foto ─── */
const FLOAT_PHRASES = [
  'you mean everything', 'only you', 'stay with me',
  'my favorite person', 'my safe place', 'always on my mind',
  'forever', 'i love you', 'my sunshine', 'just you',
  'you & me', 'mine ❤️', 'soulmate', 'always',
  'with you always', 'my heart', 'yours forever', 'to infinity',
  'the one', 'always mine'
];
const floatTexts2 = [];
function buildFloatTexts2() {
  FLOAT_PHRASES.forEach((phrase, i) => {
    const hue  = (i / FLOAT_PHRASES.length);
    const hexC = new THREE.Color().setHSL(hue, 1, .75);
    const hexG = new THREE.Color().setHSL((hue + .5)%1, 1, .65);
    const sp   = makeTextSprite(phrase, {
      fontSize: 34, width: 460, height: 80,
      color: `hsl(${Math.round(hue*360)},100%,75%)`,
      glow:  `hsl(${Math.round((hue+.15)*360%360)},100%,60%)`
    });

    // Sebar di ruang 360°
    const r     = rnd(80, 320);
    const theta = rnd(0, PI2);
    const phi   = rnd(0.1, Math.PI - 0.1);
    sp.position.set(
      r * Math.sin(phi) * Math.cos(theta),
      rnd(-300, 300),
      r * Math.sin(phi) * Math.sin(theta)
    );
    sp.userData.ySpeed = rnd(0.12, 0.4);
    sp.userData.yOfs   = rnd(0, PI2);
    sp.userData.baseY  = sp.position.y;

    scene2.add(sp);
    floatTexts2.push(sp);
  });
}

/* ════════════════════════════════════════════════════════
   RAYCASTER — Klik Ikon Hati di Scene 1 → Popup
════════════════════════════════════════════════════════ */
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2(9999, 9999);
let   isDragging = false, pDown = false;
let   prevMx = 0, prevMy = 0;

// Deteksi drag vs click
canvas.addEventListener('pointerdown', e => {
  pDown = true; isDragging = false;
  prevMx = e.clientX; prevMy = e.clientY;
});
window.addEventListener('pointermove', e => {
  pointer.x =  (e.clientX / W()) * 2 - 1;
  pointer.y = -(e.clientY / H()) * 2 + 1;
  if (pDown) {
    const dx = e.clientX - prevMx, dy = e.clientY - prevMy;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) isDragging = true;
    prevMx = e.clientX; prevMy = e.clientY;
  }
});
window.addEventListener('pointerup', () => { pDown = false; });

canvas.addEventListener('click', e => {
  if (isDragging) return;
  if (activeScene !== 1) return;
  const m = new THREE.Vector2(
    (e.clientX / W()) * 2 - 1,
   -(e.clientY / H()) * 2 + 1
  );
  raycaster.setFromCamera(m, camera);
  const hits = raycaster.intersectObjects(clickable1, false);
  if (hits.length > 0) {
    const obj = hits[0].object;
    if (obj.userData.cardIdx !== undefined) openPopup(obj.userData.cardIdx);
  }
});

// Touch support untuk klik
canvas.addEventListener('touchend', e => {
  if (isDragging) return;
  if (activeScene !== 1) return;
  const t = e.changedTouches[0];
  const m = new THREE.Vector2(
    (t.clientX / W()) * 2 - 1,
   -(t.clientY / H()) * 2 + 1
  );
  raycaster.setFromCamera(m, camera);
  const hits = raycaster.intersectObjects(clickable1, false);
  if (hits.length > 0) {
    const obj = hits[0].object;
    if (obj.userData.cardIdx !== undefined) openPopup(obj.userData.cardIdx);
  }
}, { passive: true });

/* ════════════════════════════════════════════════════════
   WARP SPEED EFFECT (canvas 2D overlay)
════════════════════════════════════════════════════════ */
function runWarp(onDone) {
  const ov = $('warp-overlay');
  const wc = $('warp-canvas');
  ov.style.display = 'block';
  gsap.fromTo(ov, { opacity:0 }, { opacity:1, duration:.35 });
  wc.width = W(); wc.height = H();
  const ctx= wc.getContext('2d');
  const cx = wc.width/2, cy = wc.height/2;
  const stars = Array.from({length:520},()=>({
    x:rnd(-1,1),y:rnd(-1,1),z:Math.random(),pz:0,hue:rnd(280,380)%360
  }));
  let speed=.002, frame=0;
  function draw(){
    if(frame>80){
      gsap.to(ov,{opacity:0,duration:.5,onComplete:()=>{ov.style.display='none';onDone();}});
      return;
    }
    frame++; speed=Math.min(speed+.0035,.11);
    ctx.fillStyle='rgba(2,0,18,.38)'; ctx.fillRect(0,0,wc.width,wc.height);
    stars.forEach(s=>{
      s.pz=s.z; s.z-=speed;
      if(s.z<=0){s.x=rnd(-1,1);s.y=rnd(-1,1);s.z=1;s.pz=1;}
      const sx=s.x/s.z*cx+cx, sy=s.y/s.z*cy+cy;
      const px=s.x/s.pz*cx+cx, py=s.y/s.pz*cy+cy;
      const br=clamp(1-s.z,.3,1);
      ctx.strokeStyle=`hsla(${s.hue},100%,80%,${br})`;
      ctx.lineWidth=clamp(Math.hypot(sx-px,sy-py)*.09,.4,4.5);
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(sx,sy);ctx.stroke();
    });
    requestAnimationFrame(draw);
  }
  draw();
}

/* ════════════════════════════════════════════════════════
   INIT SEMUA SCENE ELEMENTS
════════════════════════════════════════════════════════ */
// Referensi ke shader mat nebula untuk update uTime
let nebulaMat1, nebulaMat2, starMat1, starMat2;

function initAll() {
  // Scene 1
  nebulaMat1 = buildNebula1();
  starMat1   = buildStars(scene1, 2500, [-1200, -80]);
  buildHeart3D();
  buildGalaxy();
  buildOrbitTexts();
  buildOrbitIcons();

  // Scene 2
  nebulaMat2 = buildNebula2();

  buildFloatingPhotos();

initAll();

/* ════════════════════════════════════════════════════════
   RENDER LOOP (60 FPS target)
════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let   T     = 0; // elapsed time
let   colorT= 0; // color shift accumulator

function updateScene1(t, dt) {
  // Nebula + star shader time
  nebulaMat1.uniforms.uTime.value = t;
  if (starMat1) starMat1.uniforms.uTime.value = t;

  // Hati 3D: shader handles rotation & pulse via uTime
  if (heartMat1) heartMat1.uniforms.uTime.value = t;

  // Galaksi berputar
  if (galaxyMesh1) {
    galaxyMesh1.rotation.y = t * 0.07;
    if (galaxyMat1) galaxyMat1.uniforms.uTime.value = t;
  }

  // Orbit text mengelilingi galaksi
  orbitTexts.forEach(sp => {
    sp.userData.orbitAngle += 0.005;
    const a = sp.userData.orbitAngle;
    const r = sp.userData.orbitRadius;
    sp.position.set(
      Math.cos(a) * r,
      sp.userData.orbitY + Math.sin(t * .4 + a) * 18,
      Math.sin(a) * r
    );
    sp.material.opacity = .7 + .3 * Math.sin(t * 2 + a);
  });

  // Orbit icon hati (lebih cepat)
  orbitIcons.forEach(sp => {
    sp.userData.orbitAngle += 0.009;
    const a = sp.userData.orbitAngle;
    const r = sp.userData.orbitRadius;
    sp.position.set(
      Math.cos(a) * r,
      sp.userData.orbitY + Math.sin(t * .5 + a) * 22,
      Math.sin(a) * r
    );
    // Glow pulse
    const s = 1 + 0.25 * Math.sin(t * 3 + sp.userData.orbitAngle);
    sp.scale.set(52*s, 52*s, 1);
  });

  // Dynamic color shift nebula (Pink → Cyan)
  colorT += dt * 0.04;
  const cR = (Math.sin(colorT) + 1) / 2;
  nebulaMat1.uniforms.uColor1.value.setHSL(.75 + cR * .2, .9, .22);
  nebulaMat1.uniforms.uColor2.value.setHSL(.88 - cR * .3, 1,  .30);
}

function updateScene2(t, dt) {
  // Nebula + stars
  nebulaMat2.uniforms.uTime.value = t;
  if (starMat2) starMat2.uniforms.uTime.value = t;

  // Foto melayang naik ke atas secara halus (lalu wrap)
  photoFrames.forEach(g => {
    g.position.y += g.userData.ySpeed * 0.4;
    // Wrap: kembali ke bawah saat terlalu tinggi
    if (g.position.y > 380) g.position.y = -380;
    // Gentle side wobble
    g.rotation.z = Math.sin(t * .3 + g.userData.yOfs) * 0.08;
  });

  // Teks melayang
  floatTexts2.forEach(sp => {
    sp.position.y += sp.userData.ySpeed * 0.35;
    if (sp.position.y > 380) sp.position.y = -380;
    sp.material.opacity = .55 + .45 * Math.sin(t + sp.userData.yOfs);
  });
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  T += dt;

  controls.update(); // damping

  if (activeScene === 1) {
    updateScene1(T, dt);
    renderer.render(scene1, camera);
  } else {
    updateScene2(T, dt);
    renderer.render(scene2, camera);
  }
}

animate();
